<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="90" viewBox="0 0 1280 90" fill="none">
<style>
  .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace; }
  .cursor { animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .fade { animation: fade 1.2s ease-out both; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
</style>
<defs>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#A78BFA"/>
  </linearGradient>
</defs>
<rect x="0" y="0" width="1280" height="1.5" fill="url(#accent)" opacity="0.6"/>
<text x="640.0" y="52" text-anchor="middle" class="mono" font-size="15" fill="#8B949E">
  <tspan fill="#3FB950">➜</tspan>  open to conversations about <tspan fill="#E6EDF3">mobile SDKs</tspan>, <tspan fill="#E6EDF3">Flutter/RN plugins</tspan> &amp; <tspan fill="#E6EDF3">Android</tspan><tspan class="cursor" fill="#A78BFA"> ▍</tspan>
</text>
</svg>
