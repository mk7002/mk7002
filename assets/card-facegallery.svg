<svg xmlns="http://www.w3.org/2000/svg" width="620" height="260" viewBox="0 0 620 260" fill="none">
<style>
  .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace; }
  .cursor { animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .fade { animation: fade 1.2s ease-out both; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
</style>
<defs>
  <radialGradient id="glow" cx="1" cy="0" r="0.9">
    <stop offset="0" stop-color="#3FB950" stop-opacity="0.22"/><stop offset="1" stop-color="#3FB950" stop-opacity="0"/>
  </radialGradient>
  <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#1F2630" opacity="0.35"/></pattern>
  <clipPath id="c"><rect x="1" y="1" width="618" height="258" rx="16"/></clipPath>
</defs>
<g clip-path="url(#c)">
  <rect width="620" height="260" fill="#0D1117"/>
  <rect width="620" height="260" fill="url(#dots)"/>
  <rect width="620" height="260" fill="url(#glow)"/>
  <rect width="620" height="3" fill="#3FB950"/>
</g>
<rect x="1" y="1" width="618" height="258" rx="16" stroke="#1F2630" stroke-width="1.5"/>
<text x="32" y="46" class="mono" font-size="12" fill="#3FB950" letter-spacing="1.2">ANDROID · ON-DEVICE ML</text>
<text x="588" y="46" text-anchor="end" class="mono" font-size="12" fill="#4B5563">03</text>
<text x="31" y="92" class="sans" font-size="30" font-weight="800" fill="#E6EDF3" letter-spacing="-0.5">Face Gallery</text>
<text x="32" y="132" class="sans" font-size="15" fill="#8B949E">Offline gallery in the style of Google Photos, with on-device face</text><text x="32" y="155" class="sans" font-size="15" fill="#8B949E">grouping: ML Kit detection, 5-point alignment and MobileFaceNet</text><text x="32" y="178" class="sans" font-size="15" fill="#8B949E">embeddings. 0% wrong faces on LFW.</text>
<rect x="32" y="202" width="67.6" height="26" rx="13" fill="#07090D" stroke="#1F2630"/><text x="65.8" y="219.5" text-anchor="middle" class="mono" font-size="12" fill="#C9D1D9">Kotlin</text><rect x="107.6" y="202" width="75.19999999999999" height="26" rx="13" fill="#07090D" stroke="#1F2630"/><text x="145.2" y="219.5" text-anchor="middle" class="mono" font-size="12" fill="#C9D1D9">Compose</text><rect x="190.79999999999998" y="202" width="67.6" height="26" rx="13" fill="#07090D" stroke="#1F2630"/><text x="224.59999999999997" y="219.5" text-anchor="middle" class="mono" font-size="12" fill="#C9D1D9">ML Kit</text><rect x="266.4" y="202" width="67.6" height="26" rx="13" fill="#07090D" stroke="#1F2630"/><text x="300.2" y="219.5" text-anchor="middle" class="mono" font-size="12" fill="#C9D1D9">LiteRT</text><rect x="342.0" y="202" width="52.4" height="26" rx="13" fill="#07090D" stroke="#1F2630"/><text x="368.2" y="219.5" text-anchor="middle" class="mono" font-size="12" fill="#C9D1D9">Room</text>
<text x="588" y="219.5" text-anchor="end" class="mono" font-size="12" fill="#3FB950">source coming soon</text>
