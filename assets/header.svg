<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" fill="none">
<style>
  .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace; }
  .cursor { animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .fade { animation: fade 1.2s ease-out both; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
</style>
<defs>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#1F2630" opacity="0.55"/></pattern>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#A78BFA"/>
  </linearGradient>
  <radialGradient id="glowA" cx="0.85" cy="0.1" r="0.6">
    <stop offset="0" stop-color="#A78BFA" stop-opacity="0.28"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glowB" cx="0.05" cy="1" r="0.55">
    <stop offset="0" stop-color="#22D3EE" stop-opacity="0.18"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
  </radialGradient>
  <clipPath id="frame"><rect x="1" y="1" width="1278" height="338" rx="18"/></clipPath>
</defs>
<g clip-path="url(#frame)">
  <rect width="1280" height="340" fill="#07090D"/>
  <rect width="1280" height="340" fill="url(#dots)"/>
  <rect width="1280" height="340" fill="url(#glowA)"/>
  <rect width="1280" height="340" fill="url(#glowB)"/>
  <!-- window chrome -->
  <rect width="1280" height="44" fill="#0D1117" opacity="0.85"/>
  <line x1="0" y1="44" x2="1280" y2="44" stroke="#1F2630"/>
  <circle cx="28" cy="22" r="6" fill="#FF5F57"/><circle cx="48" cy="22" r="6" fill="#FEBC2E"/><circle cx="68" cy="22" r="6" fill="#28C840"/>
  <text x="640.0" y="27" text-anchor="middle" class="mono" font-size="13" fill="#8B949E">milind@mumbai: ~/engineering</text>
  <!-- content -->
  <g>
    <text x="64" y="104" class="mono" font-size="15" fill="#4B5563">// senior software engineer · mobile</text>
    <text x="62" y="172" class="sans" font-size="64" font-weight="800" fill="#E6EDF3" letter-spacing="-1.5">Milind Keni</text>
    <text x="64" y="214" class="sans" font-size="24" font-weight="600" fill="url(#accent)">Mobile SDKs · Cross-platform plugins · On-device ML</text>
    <text x="64" y="278" class="mono" font-size="17">
      <tspan fill="#3FB950">➜</tspan><tspan fill="#22D3EE">  ~</tspan><tspan fill="#E6EDF3">  ./ship --android --ios --flutter --rn --unity</tspan><tspan class="cursor" fill="#A78BFA"> ▍</tspan>
    </text>
  </g>
  <!-- right-side code motif -->
  <g class="mono" font-size="14" fill="#4B5563" opacity="0.9">
    <text x="900" y="100">@WebEngage</text>
    <text x="900" y="124"><tspan fill="#A78BFA">class</tspan> <tspan fill="#E6EDF3">Engineer</tspan> {</text>
    <text x="924" y="148"><tspan fill="#A78BFA">val</tspan> years = <tspan fill="#22D3EE">6</tspan></text>
    <text x="924" y="172"><tspan fill="#A78BFA">val</tspan> base  = <tspan fill="#3FB950">"Mumbai"</tspan></text>
    <text x="924" y="196"><tspan fill="#A78BFA">val</tspan> loves = <tspan fill="#3FB950">"offline-first"</tspan></text>
    <text x="900" y="220">}</text>
  </g>
  <rect x="0" y="337" width="1280" height="3" fill="url(#accent)"/>
</g>
<rect x="1" y="1" width="1278" height="338" rx="18" stroke="#1F2630" stroke-width="1.5"/>
</svg>
