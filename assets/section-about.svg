<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="64" viewBox="0 0 1280 64" fill="none">
<style>
  .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace; }
  .cursor { animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .fade { animation: fade 1.2s ease-out both; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
</style>
<defs>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22D3EE" stop-opacity="0.9"/>
    <stop offset="0.5" stop-color="#A78BFA" stop-opacity="0.5"/>
    <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
  </linearGradient>
</defs>
<text x="0" y="40" class="mono" font-size="15" fill="#22D3EE">// 01</text>
<text x="56" y="41" class="sans" font-size="24" font-weight="700" fill="#C9D1D9" letter-spacing="0.3">About</text>
<rect x="187.5" y="34" width="1092.5" height="1.5" fill="url(#line)"/>
</svg>
