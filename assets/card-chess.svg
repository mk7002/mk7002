<svg xmlns="http://www.w3.org/2000/svg" width="620" height="260" viewBox="0 0 620 260" fill="none">
<style>
  .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace; }
  .cursor { animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .fade { animation: fade 1.2s ease-out both; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
</style>
<defs>
  <radialGradient id="glow" cx="1" cy="0" r="0.9">
    <stop offset="0" stop-color="#FBBF24" stop-opacity="0.22"/><stop offset="1" stop-color="#FBBF24" stop-opacity="0"/>
  </radialGradient>
  <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#1F2630" opacity="0.35"/></pattern>
  <clipPath id="c"><rect x="1" y="1" width="618" height="258" rx="16"/></clipPath>
</defs>
<g clip-path="url(#c)">
  <rect width="620" height="260" fill="#0D1117"/>
  <rect width="620" height="260" fill="url(#dots)"/>
  <rect width="620" height="260" fill="url(#glow)"/>
  <rect width="620" height="3" fill="#FBBF24"/>
</g>
<rect x="1" y="1" width="618" height="258" rx="16" stroke="#1F2630" stroke-width="1.5"/>
<text x="32" y="46" class="mono" font-size="12" fill="#FBBF24" letter-spacing="1.2">ANDROID · GAME ENGINE</text>
<text x="588" y="46" text-anchor="end" class="mono" font-size="12" fill="#4B5563">04</text>
<text x="31" y="92" class="sans" font-size="30" font-weight="800" fill="#E6EDF3" letter-spacing="-0.5">Chess Trainer</text>
<text x="32" y="132" class="sans" font-size="15" fill="#8B949E">Bots at levels 1–10 with a live coach: threats, the opponent's</text><text x="32" y="155" class="sans" font-size="15" fill="#8B949E">plan, hints and move grades. The chess engine is written from</text><text x="32" y="178" class="sans" font-size="15" fill="#8B949E">scratch. Glass and 3D board styles.</text>
<rect x="32" y="202" width="67.6" height="26" rx="13" fill="#07090D" stroke="#1F2630"/><text x="65.8" y="219.5" text-anchor="middle" class="mono" font-size="12" fill="#C9D1D9">Kotlin</text><rect x="107.6" y="202" width="75.19999999999999" height="26" rx="13" fill="#07090D" stroke="#1F2630"/><text x="145.2" y="219.5" text-anchor="middle" class="mono" font-size="12" fill="#C9D1D9">Compose</text><rect x="190.79999999999998" y="202" width="120.8" height="26" rx="13" fill="#07090D" stroke="#1F2630"/><text x="251.2" y="219.5" text-anchor="middle" class="mono" font-size="12" fill="#C9D1D9">Custom engine</text>
<text x="588" y="219.5" text-anchor="end" class="mono" font-size="12" fill="#FBBF24">source coming soon</text>
</svg>
