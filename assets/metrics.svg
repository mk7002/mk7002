<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="132" viewBox="0 0 1280 132" fill="none">
<style>
  .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace; }
  .cursor { animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .fade { animation: fade 1.2s ease-out both; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
</style>
<defs>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#A78BFA"/>
  </linearGradient>
</defs>
<rect x="1" y="1" width="1278" height="130" rx="16" fill="#0D1117" stroke="#1F2630" stroke-width="1.5"/>

  <text x="160.0" y="68" text-anchor="middle" class="sans" font-size="40" font-weight="800" fill="url(#accent)">6+</text>
  <text x="160.0" y="98" text-anchor="middle" class="mono" font-size="13" fill="#8B949E" letter-spacing="0.5">YEARS SHIPPING MOBILE</text><line x1="320.0" y1="28" x2="320.0" y2="104" stroke="#1F2630"/>
  <text x="480.0" y="68" text-anchor="middle" class="sans" font-size="40" font-weight="800" fill="url(#accent)">280+</text>
  <text x="480.0" y="98" text-anchor="middle" class="mono" font-size="13" fill="#8B949E" letter-spacing="0.5">SDK COMMITS @ WEBENGAGE</text><line x1="640.0" y1="28" x2="640.0" y2="104" stroke="#1F2630"/>
  <text x="800.0" y="68" text-anchor="middle" class="sans" font-size="40" font-weight="800" fill="url(#accent)">120K+</text>
  <text x="800.0" y="98" text-anchor="middle" class="mono" font-size="13" fill="#8B949E" letter-spacing="0.5">PLAY STORE INSTALLS</text><line x1="960.0" y1="28" x2="960.0" y2="104" stroke="#1F2630"/>
  <text x="1120.0" y="68" text-anchor="middle" class="sans" font-size="40" font-weight="800" fill="url(#accent)">24+</text>
  <text x="1120.0" y="98" text-anchor="middle" class="mono" font-size="13" fill="#8B949E" letter-spacing="0.5">PRODUCTION APPS SHIPPED</text>
</svg>
