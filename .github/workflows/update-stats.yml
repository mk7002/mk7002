name: Update activity graphs

on:
  schedule:
    - cron: "30 2 * * *" # daily, 08:00 IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild activity SVGs
        run: python3 scripts/update_stats.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- assets; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/stats-mobile.svg assets/contributions.svg assets/contributions-mobile.svg
          git commit -m "Update activity graphs"
          git push
